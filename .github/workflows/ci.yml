name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - "release/**"
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changeset-check:
    name: Changeset Check
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Activates the pnpm version pinned in the root manifest packageManager field.
      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The Version Packages PR consumes the changesets it releases, so the check cannot pass on it. A branch name
      # alone is no proof (anyone can push a changeset-release/* branch), so the PR must also come from the bot.
      - name: Check for changesets
        if: ${{ !(startsWith(github.head_ref, 'changeset-release/') && github.event.pull_request.user.login == 'csag-changesets-bot[bot]') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm exec changeset status --since="origin/$BASE_REF"

  # Keep the job name: the branch ruleset requires the "Verify" check.
  verify:
    name: Verify
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run prettier-check

      - name: Lint
        run: pnpm run lint

      # rollup-plugin-typescript2 type-checks src and fails the build on errors.
      - name: Build
        run: pnpm run build

      # cypress/ is a separate pnpm project. It imports the built package from dist/ and
      # React from the root node_modules, both through `link:`.
      - name: Install component test dependencies
        working-directory: cypress
        run: pnpm install --frozen-lockfile

      - name: Component tests (React 19)
        working-directory: cypress
        run: pnpm exec cypress run --component

      # The peer range includes React 18. React is external to the bundle, so dist/ stays
      # as built, and the component tests pick up React 18 through the root node_modules.
      # Exact versions, still subject to minimumReleaseAge. The change to the manifest and
      # the lockfile stays in this job, which holds no secrets.
      - name: Switch to React 18
        run: pnpm add --save-dev react@18.3.1 react-dom@18.3.1 # zizmor: ignore[adhoc-packages] React 18 compatibility run, exact versions, no secrets in this job

      - name: Component tests (React 18)
        working-directory: cypress
        run: pnpm exec cypress run --component

      - name: Upload Cypress screenshots and videos
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cypress-snapshots
          path: |
            cypress/cypress/screenshots
            cypress/cypress/videos
          if-no-files-found: ignore

  # Static analysis of the workflows themselves (template injection, unpinned actions,
  # excessive permissions). Findings fail the job.
  zizmor:
    name: zizmor
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
